baseURL: "https://BradleyZhang.github.io/DualHN/"

title: "DualHN"
theme: ["PaperMod"]

locale: "zh-cn"
defaultContentLanguage: "zh"
hasCJKLanguage: true # 按中日韩字符统计字数与阅读时间
enableRobotsTXT: true
enableEmoji: true

timeZone: "Asia/Shanghai"

buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 20

# home 额外输出 JSON，供站内搜索使用
# outputs:
#   home:
#     - HTML
#     - RSS
#     - JSON
#   section:
#     - HTML
#     - RSS

menu:
  main:
    - identifier: home
      name: Home
      url: /
      weight: 10
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
    # - identifier: search
    #   name: 搜索
    #   url: /search/
    #   weight: 30

params:
  env: production
  description: "每早提供昨天 Hacker News 热门文章的 LLM 双语翻译"
  # author: "DualHN"
  defaultTheme: auto

  # 列表页/文章页的日期显示格式
  DateFormat: "2006-01-02"

  # 首页顶部简介
  homeInfoParams:
    Title: "DualHN"
    Content: |
      每早提供昨天 Hacker News 热门文章的 LLM 双语翻译

      topKHN is a personal learning project. To make it convenient for using, I have made it publicly accessible on the internet. I hope it will remain just a small, unobtrusive corner of the internet that doesn’t get in anyone’s way.

      This project is intended for personal learning and technical research, and is not intended for commercial profit. I respect the rights of original authors and creators. I have no intention of infringing upon anyone’s copyright or causing offense.

      If you are an author, creator, or copyright holder of any content featured on this website and have concerns about how your work is presented or used, please feel free to contact me. I will take your concerns seriously and am willing to promptly remove the  content upon receiving a  removal request. 

      More broadly, if anyone finds this website or its content uncomfortable, offensive, or otherwise concerning, please feel free to reach out.I am willing to take the entire site offline promptly upon request.

      The copyright of all original content featured on this website remains with its respective authors and copyright holders. I will make every effort to credit the original sources and provide links to the original articles, out of respect for the creators’ work and to help readers access the original material.

      Thank you to every creator who contributes knowledge and ideas to the internet.

  ShowReadingTime: true
  ShowWordCount: false
  ShowShareButtons: false
  ShowPostNavLinks: true # 同一天内的上一篇/下一篇
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowFullTextinRSS: true
  ShowPageNums: true
  ShowToc: true
  hideAuthor: true

  socialIcons:
    - name: github
      title: View Source on Github
      url: "https://github.com/BradleyZhang/DualHN"
    - name: rss
      title: RSS
      url: "https://BradleyZhang.github.io/DualHN/index.xml"
    - name: email
      title: email
      url: mailto:bradley-zhang@outlook.com?subject=[DualHN]

markup:
  goldmark:
    renderer:
      unsafe: true # 允许正文内嵌 HTML
  highlight:
    noClasses: false
